load_module modules/ngx_rtmp_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name _;

        location = /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            on_publish http://api:3001/internal/rtmp/on_publish?token=replace-with-a-long-random-token;
            on_publish_done http://api:3001/internal/rtmp/on_publish_done?token=replace-with-a-long-random-token;
        }
    }
}